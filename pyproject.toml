[project]
name = "ownfoil"
version = "2.4.0.dev0"
description = "Self-hosted Nintendo Switch shop, compatible with Tinfoil, Cyberfoil and Sphaira."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask-login==0.6.3",
    "flask-migrate==4.1.0",
    "flask-sqlalchemy==3.1.1",
    "gunicorn==26.0.0 ; sys_platform != 'win32'",
    "nsz @ git+https://github.com/nicoboss/nsz.git@3c4500647cb12fad09728965ed2612b25637b626",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "setproctitle==1.3.7",
    "unzip-http==0.7",
    "watchdog==6.0.0",
    "werkzeug==3.1.8",
    "zstandard==0.25.0",
]

[project.scripts]
ownfoil = "ownfoil.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ownfoil"]

[tool.hatch.build.targets.wheel.force-include]
"app" = "ownfoil/_app"
