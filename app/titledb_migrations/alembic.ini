# Alembic configuration for config/titles.db (see README).
# Paths are resolved against this file so the CLI works from any directory.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os

# Used by the CLI only; at runtime db.init_db passes a live connection instead.
sqlalchemy.url = sqlite:///%(here)s/../config/titles.db
