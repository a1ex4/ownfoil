{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/archivo/archivo.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='store.css') }}">

<style>
    .sx-backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
    }
    .sx-backdrop img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .6s ease;
        -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 40%, transparent 100%);
    }
    .sx-backdrop img.is-on { opacity: .42; }
    .sx-backdrop::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(180deg, rgba(28, 29, 33, .75) 0, rgba(28, 29, 33, 0) 140px),
            linear-gradient(90deg, rgba(28, 29, 33, .92) 0%, rgba(28, 29, 33, .7) 42%, rgba(28, 29, 33, .35) 100%);
    }

    .sx-title {
        display: grid;
        grid-template-columns: minmax(400px, .85fr) minmax(0, 1.25fr);
        gap: 40px clamp(32px, 4vw, 72px);
        padding: 96px var(--sx-gutter) 48px;
    }

    /* Info column */
    .sx-info { display: flex; flex-direction: column; min-width: 0; }
    .sx-head { display: flex; align-items: center; gap: 18px; }
    .sx-icon {
        width: 84px;
        height: 84px;
        flex-shrink: 0;
        border-radius: 14px;
        object-fit: cover;
        box-shadow: 0 10px 28px -12px rgba(0, 0, 0, .8);
    }
    .sx-by { margin: 0; color: var(--sx-graphite); font-size: 15px; font-weight: 500; line-height: 1.45; }
    .sx-by strong { display: block; color: var(--sx-paper); font-weight: 600; }
    .sx-name {
        margin: 22px 0 0;
        font-size: clamp(32px, 3.4vw, 60px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -.01em;
        text-wrap: balance;
    }
    .sx-intro { margin: 16px 0 0; max-width: 54ch; font-size: 17px; line-height: 1.45; color: rgba(241, 241, 238, .88); }
    .sx-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
    .sx-facts li {
        padding: 5px 12px;
        border: 1px solid rgba(241, 241, 238, .2);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
    }

    .sx-desc-wrap { margin-top: 22px; min-height: 0; }
    .sx-desc {
        margin: 0;
        max-width: 64ch;
        color: rgba(241, 241, 238, .72);
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-line;
    }
    .sx-link {
        margin-top: 8px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--sx-blue);
        font: 600 14px var(--sx-font);
        cursor: pointer;
        align-self: flex-start;
    }
    .sx-link:hover { text-decoration: underline; }
    .sx-link:focus-visible { outline: 2px solid var(--sx-blue); outline-offset: 3px; border-radius: 2px; }

    .sx-own {
        margin: 26px 0 0;
        padding: 6px 20px;
        border-radius: 16px;
        background: rgba(39, 40, 46, .78);
        backdrop-filter: blur(10px);
    }
    .sx-own-row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--sx-line);
    }
    .sx-own-row:first-child { border-top: 0; }
    .sx-own dt { color: var(--sx-graphite); font-size: 14px; font-weight: 500; }
    .sx-own dd { margin: 0; font-size: 14px; }
    .sx-own dd strong { font-weight: 600; }
    .sx-own dd span { display: block; margin-top: 2px; color: var(--sx-graphite); }
    .sx-own .is-due { color: var(--sx-red); }
    .sx-own .is-good { color: var(--sx-blue); }

    /* Media column */
    .sx-media { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .sx-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: 0;
        border-radius: 18px;
        overflow: hidden;
        background: var(--sx-dock);
        cursor: zoom-in;
        box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9);
    }
    .sx-stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .35s ease;
    }
    .sx-stage img.is-on { opacity: 1; }
    .sx-stage:focus-visible { outline: 3px solid var(--sx-blue); outline-offset: 3px; }
    .sx-thumbs { display: flex; gap: 12px; padding: 6px; margin: -6px; overflow-x: auto; scrollbar-width: none; }
    .sx-thumb {
        flex: 1 0 0;
        min-width: 96px;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: 0;
        border-radius: 10px;
        overflow: hidden;
        background: var(--sx-dock);
        opacity: .55;
        cursor: pointer;
        transition: opacity .2s ease;
    }
    .sx-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sx-thumb:hover, .sx-thumb[aria-current="true"] { opacity: 1; }
    .sx-thumb:focus-visible { outline: 3px solid var(--sx-blue); outline-offset: 3px; }

    .sx-missing { grid-column: 1 / -1; padding-top: 12vh; }
    .sx-missing h1 { font-size: 40px; font-weight: 800; }
    .sx-missing p { color: var(--sx-graphite); margin: 12px 0 24px; }

    /* Dialogs */
    .sx-dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: min(80vh, 760px);
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: var(--sx-dock);
        color: var(--sx-paper);
        box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .8);
    }
    .sx-dialog::backdrop { background: rgba(10, 10, 12, .7); backdrop-filter: blur(4px); }
    .sx-dialog-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 26px 16px;
        background: var(--sx-dock);
    }
    .sx-dialog-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .sx-dialog-head small { display: block; margin-top: 4px; color: var(--sx-graphite); font-size: 13px; }
    .sx-close {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(241, 241, 238, .1);
        color: var(--sx-paper);
        font-size: 18px;
    }
    .sx-close:hover { background: rgba(241, 241, 238, .18); }
    .sx-close:focus-visible { outline: 2px solid var(--sx-blue); outline-offset: 2px; }
    .sx-dialog-body { padding: 4px 26px 26px; }
    .sx-dialog-body .sx-desc { max-width: none; color: rgba(241, 241, 238, .85); }
    .sx-dialog-body h3 { margin: 18px 0 6px; font-size: 15px; font-weight: 700; color: var(--sx-graphite); }
    .sx-list { margin: 0; padding: 0; list-style: none; }
    .sx-list li {
        display: grid;
        grid-template-columns: 1fr 104px 76px 64px;
        gap: 16px;
        align-items: baseline;
        padding: 10px 0;
        border-top: 1px solid var(--sx-line);
        font-size: 14px;
    }
    .sx-list .sx-meta { color: var(--sx-graphite); font-variant-numeric: tabular-nums; }
    .sx-list .sx-size { text-align: right; }
    .sx-list .is-owned { color: var(--sx-blue); font-weight: 600; }
    .sx-list .is-missing { color: var(--sx-graphite); }

    .sx-shot-dialog {
        width: min(1600px, calc(100vw - 48px));
        max-height: none;
        background: transparent;
        box-shadow: none;
        overflow: visible;
    }
    .sx-shot-dialog img { display: block; width: 100%; border-radius: 16px; }
    .sx-shot-bar { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
    .sx-shot-bar span { min-width: 64px; text-align: center; color: var(--sx-graphite); font-variant-numeric: tabular-nums; }

    /* On a laptop-sized screen or bigger the page is exactly one screen tall: the
       description gives up whatever room the rest needs, and opens in full on request. */
    @media (min-width: 1100px) and (min-height: 680px) {
        .sx-title { height: 100dvh; grid-template-rows: minmax(0, 1fr); align-items: center; }
        .sx-info { min-height: 0; max-height: 100%; }
        .sx-info > * { flex-shrink: 0; }
        .sx-desc-wrap { flex: 0 1 auto; overflow: hidden; }
        .sx-desc-wrap.is-cut {
            -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent);
            mask-image: linear-gradient(180deg, #000 72%, transparent);
        }
        .sx-stage { width: min(100%, calc((100dvh - 260px) * 16 / 9)); }
        .sx-thumbs { width: min(100%, calc((100dvh - 260px) * 16 / 9)); }
    }

    @media (max-width: 1099px) {
        .sx-title { grid-template-columns: 1fr; }
        .sx-media { order: -1; }
    }
    @media (max-width: 600px) {
        .sx-title { padding-top: 84px; }
        .sx-own-row { grid-template-columns: 90px 1fr; }
        .sx-list li { grid-template-columns: 1fr auto; }
        .sx-list li .sx-meta { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        .sx-backdrop img, .sx-stage img, .sx-thumb { transition: none; }
    }
</style>

<div class="sx-ambient" aria-hidden="true"><img alt=""></div>
<div class="sx-backdrop" aria-hidden="true"><img id="backdrop" alt=""></div>

{% with transparent_nav=True %}{% include 'nav.html' %}{% endwith %}

<main class="sx-title" id="page">
    <section class="sx-info" id="info" aria-live="polite">
        <p class="sx-by">Loading…</p>
    </section>
    <section class="sx-media" id="media" aria-label="Screenshots"></section>
</main>

<dialog class="sx-dialog" id="descDialog" aria-labelledby="descDialogTitle">
    <div class="sx-dialog-head">
        <h2 id="descDialogTitle">About this game</h2>
        <button class="sx-close" type="button" data-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sx-dialog-body"><p class="sx-desc" id="descFull"></p></div>
</dialog>

<dialog class="sx-dialog" id="contentDialog" aria-labelledby="contentDialogTitle">
    <div class="sx-dialog-head">
        <div>
            <h2 id="contentDialogTitle">Updates and DLC</h2>
            <small id="contentDialogId"></small>
        </div>
        <button class="sx-close" type="button" data-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sx-dialog-body" id="contentDialogBody"></div>
</dialog>

<dialog class="sx-dialog sx-shot-dialog" id="shotDialog" aria-label="Screenshot">
    <img id="shotFull" alt="">
    <div class="sx-shot-bar">
        <button class="sx-close" type="button" data-step="-1" aria-label="Previous screenshot"><i class="bi bi-chevron-left"></i></button>
        <span id="shotCount"></span>
        <button class="sx-close" type="button" data-step="1" aria-label="Next screenshot"><i class="bi bi-chevron-right"></i></button>
        <button class="sx-close" type="button" data-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
</dialog>

<script src="{{ url_for('static', filename='js/format.js') }}"></script>
<script>
    const TITLE_ID = {{ title_id|tojson }};
    const SHOP_NAME = {{ shop_name|tojson }};

    // One call for the whole page. `files` is admin only and carries the sizes, so a
    // shop user simply sees no size column.
    const TITLE_QUERY = `
        query TitleDetails($titleId: ID!) {
            title(titleId: $titleId) {
                titleId name intro description developer publisher releaseDate
                category numberOfPlayers rating size
                icon(size: CLIENT) { url }
                banner(size: ORIGINAL) { url }
                bannerThumb: banner(size: THUMB) { url }
                shots: screenshots(size: SCREEN) { url }
                thumbs: screenshots(size: THUMB) { url }
                full: screenshots(size: ORIGINAL) { url }
                apps {
                    appId appType appVersion owned releaseDate displayVersion
                    titledb { name releaseDate }
                    files { size }
                }
            }
        }`;

    const $ = id => document.getElementById(id);
    let title = null;
    let shot = 0;

    async function gqlFetch(query, variables) {
        const params = new URLSearchParams({query, variables: JSON.stringify(variables)});
        const r = await fetch('/api/graphql?' + params, {
            headers: {'Accept': 'application/json'},
            credentials: 'same-origin',
        });
        if (!r.ok) throw new Error(`GraphQL HTTP ${r.status}`);
        const body = await r.json();
        if (body.errors && body.errors.length) throw new Error(JSON.stringify(body.errors));
        return body.data;
    }

    // Everything shown comes from titledb or the filesystem, so it all goes in as text.
    function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
            if (key === 'class') node.className = value;
            else node.setAttribute(key, value);
        }
        node.append(...children.filter(c => c !== null && c !== undefined && c !== ''));
        return node;
    }

    const LATIN = /^[\p{Script=Latin}\p{N}\p{P}\p{Zs}\p{S}]+$/u;
    const cleanName = name => (name || 'Unrecognized title').replace(/[™®]/g, '').replace(/\s{2,}/g, ' ').trim();

    function formatDate(value) {
        const s = String(value || '');
        const iso = /^\d{8}$/.test(s) ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}` : s.slice(0, 10);
        const d = new Date(iso);
        return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
    }

    /** Nintendo numbers updates in steps of 65536: 196608 is the third one. */
    function updateNumber(appVersion) {
        return appVersion % 65536 === 0 ? appVersion / 65536 : appVersion;
    }

    function playersLabel(p) {
        if (!p) return '';
        return p === '1' ? '1 player' : `${p.replace(/\s*[-~]\s*/, '–')} players`;
    }

    const totalSize = files => (files || []).reduce((sum, f) => sum + Number(f.size || 0), 0);

    /** What the library holds for this title, read the way a player asks it. */
    function ownership(apps) {
        const base = apps.filter(a => a.appType === 'BASE').sort((a, b) => b.appVersion - a.appVersion);
        const updates = apps.filter(a => a.appType === 'UPDATE').sort((a, b) => b.appVersion - a.appVersion);
        const dlcById = new Map();
        apps.filter(a => a.appType === 'DLC').forEach(a => {
            const seen = dlcById.get(a.appId);
            if (!seen || a.appVersion > seen.appVersion || (a.owned && !seen.owned)) dlcById.set(a.appId, a);
        });
        const dlc = [...dlcById.values()].sort((a, b) =>
            ((a.titledb || {}).name || a.appId).localeCompare((b.titledb || {}).name || b.appId));
        return {
            base: base.find(a => a.owned) || base[0] || null,
            updates,
            latestUpdate: updates[0] || null,
            ownedUpdate: updates.find(a => a.owned) || null,
            dlc,
        };
    }

    function ownRow(label, value, note, tone) {
        return el('div', {class: 'sx-own-row'},
            el('dt', {}, label),
            el('dd', {}, el('strong', tone ? {class: tone} : {}, value), note ? el('span', {}, note) : null));
    }

    function ownershipPanel(own) {
        const rows = [];
        rows.push(own.base && own.base.owned
            ? ownRow('Base game', 'In your library', own.base.displayVersion ? `Version ${own.base.displayVersion}` : '')
            : ownRow('Base game', 'Not in your library', 'Only updates or DLC are here', 'is-due'));

        if (!own.latestUpdate) {
            rows.push(ownRow('Updates', 'None released'));
        } else if (own.ownedUpdate === own.latestUpdate) {
            rows.push(ownRow('Updates', 'Up to date', describeUpdate(own.latestUpdate), 'is-good'));
        } else {
            rows.push(ownRow('Updates', `Update ${updateNumber(own.latestUpdate.appVersion)} available`,
                own.ownedUpdate ? `You have ${describeUpdate(own.ownedUpdate).toLowerCase()}` : 'No update in your library',
                'is-due'));
        }

        const ownedDlc = own.dlc.filter(a => a.owned).length;
        rows.push(own.dlc.length
            ? ownRow('DLC', `${ownedDlc} of ${own.dlc.length} owned`, '', ownedDlc === own.dlc.length ? 'is-good' : '')
            : ownRow('DLC', 'None released'));

        return el('dl', {class: 'sx-own'}, ...rows);
    }

    function describeUpdate(app) {
        const n = `Update ${updateNumber(app.appVersion)}`;
        return app.displayVersion ? `${n}, version ${app.displayVersion}` : n;
    }

    function listItem(name, date, owned, size) {
        return el('li', {},
            el('span', {}, name),
            el('span', {class: 'sx-meta'}, formatDate(date)),
            el('span', {class: 'sx-meta sx-size'}, size ? formatBytes(size) : ''),
            el('span', {class: owned ? 'is-owned' : 'is-missing'}, owned ? 'Owned' : 'Missing'));
    }

    function fillContentDialog(own) {
        const body = $('contentDialogBody');
        body.replaceChildren();
        if (own.updates.length) {
            body.append(el('h3', {}, 'Updates'), el('ul', {class: 'sx-list'}, ...own.updates.map(a =>
                listItem(describeUpdate(a), a.releaseDate, a.owned, totalSize(a.files)))));
        }
        if (own.dlc.length) {
            body.append(el('h3', {}, 'DLC'), el('ul', {class: 'sx-list'}, ...own.dlc.map(a =>
                listItem(cleanName((a.titledb || {}).name || a.appId), (a.titledb || {}).releaseDate, a.owned,
                         totalSize(a.files)))));
        }
        $('contentDialogId').textContent = `Title ID ${title.titleId}`;
    }

    function renderInfo() {
        const t = title;
        const own = ownership(t.apps || []);
        const year = /^\d{8}$/.test(t.releaseDate || '') ? t.releaseDate.slice(0, 4) : '';
        const studio = t.developer && t.developer !== t.publisher ? `Developed by ${t.developer}` : '';
        const intro = t.intro && LATIN.test(t.intro) ? t.intro.trim() : '';
        const facts = [...(t.category || []).filter(c => LATIN.test(c)).slice(0, 3),
                       playersLabel(t.numberOfPlayers),
                       t.rating ? `Ages ${t.rating}+` : '',
                       t.size ? formatBytes(t.size) : '',
                       formatDate(t.releaseDate)].filter(Boolean);

        const info = $('info');
        info.replaceChildren(
            el('div', {class: 'sx-head'},
                t.icon ? el('img', {class: 'sx-icon', src: t.icon.url, alt: ''}) : null,
                el('p', {class: 'sx-by'},
                    el('strong', {}, [t.publisher, year].filter(Boolean).join(', ')),
                    studio)),
            el('h1', {class: 'sx-name sx-wide'}, cleanName(t.name)),
            intro ? el('p', {class: 'sx-intro'}, intro) : null,
            facts.length ? el('ul', {class: 'sx-facts'}, ...facts.map(f => el('li', {}, f))) : null,
        );

        const description = (t.description || '').trim();
        if (description) {
            const wrap = el('div', {class: 'sx-desc-wrap'}, el('p', {class: 'sx-desc'}, description));
            const more = el('button', {class: 'sx-link', type: 'button'}, 'Read full description');
            more.addEventListener('click', () => $('descDialog').showModal());
            $('descFull').textContent = description;
            info.append(wrap, more);
        }

        info.append(ownershipPanel(own));
        if (own.updates.length || own.dlc.length) {
            fillContentDialog(own);
            const all = el('button', {class: 'sx-link', type: 'button'}, 'See every update and DLC');
            all.addEventListener('click', () => $('contentDialog').showModal());
            info.append(all);
        }
        fitDescription();
    }

    /** Whether the description had to give up lines, which decides the fade and whether
     *  "Read full description" is worth showing. */
    function fitDescription() {
        const wrap = document.querySelector('.sx-desc-wrap');
        if (!wrap) return;
        const cut = wrap.scrollHeight > wrap.clientHeight + 2;
        wrap.classList.toggle('is-cut', cut);
        wrap.nextElementSibling.hidden = !cut && wrap.clientHeight > 0;
    }

    function renderMedia() {
        const shots = title.shots || [];
        const media = $('media');
        if (!shots.length) {
            media.hidden = true;
            document.querySelector('.sx-title').style.gridTemplateColumns = 'minmax(0, 720px)';
            return;
        }
        const stage = el('button', {class: 'sx-stage', type: 'button', 'aria-label': 'Open screenshot full size'},
            el('img', {alt: ''}), el('img', {alt: ''}));
        stage.addEventListener('click', () => { showFull(); $('shotDialog').showModal(); });

        const thumbs = el('div', {class: 'sx-thumbs'}, ...(title.thumbs || shots).map((s, i) => {
            const b = el('button', {class: 'sx-thumb', type: 'button', 'aria-label': `Screenshot ${i + 1}`},
                el('img', {src: s.url, alt: '', loading: 'lazy'}));
            b.addEventListener('click', () => showShot(i));
            return b;
        }));
        media.replaceChildren(stage, shots.length > 1 ? thumbs : '');
        showShot(0);
    }

    /** Two stacked layers, so the next screenshot fades in over the current one
     *  instead of the stage flashing empty while it decodes. */
    let stageToken = 0;
    function showShot(index) {
        const shots = title.shots || [];
        if (!shots.length) return;
        shot = (index + shots.length) % shots.length;
        const layers = document.querySelectorAll('.sx-stage img');
        const front = document.querySelector('.sx-stage img.is-on');
        const back = layers[0] === front ? layers[1] : layers[0];
        const token = ++stageToken;
        back.onload = () => {
            if (token !== stageToken) return;
            back.classList.add('is-on');
            if (front) front.classList.remove('is-on');
        };
        back.src = shots[shot].url;
        document.querySelectorAll('.sx-thumb').forEach((b, i) => {
            b.setAttribute('aria-current', String(i === shot));
            b.classList.toggle('sx-ring', i === shot);
        });
        if ($('shotDialog').open) showFull();
    }

    function showFull() {
        const full = title.full || title.shots;
        $('shotFull').src = full[shot].url;
        $('shotCount').textContent = `${shot + 1} of ${full.length}`;
    }

    function renderMissing() {
        $('media').hidden = true;
        $('info').replaceChildren(el('div', {class: 'sx-missing'},
            el('h1', {class: 'sx-wide'}, 'Game not found'),
            el('p', {}, `Nothing in your library or the catalogue has the ID ${TITLE_ID}.`),
            el('a', {class: 'sx-btn sx-btn--quiet', href: '/'}, 'Back to the library')));
    }

    function setLayer(img, src) {
        if (!src) return;
        img.onload = () => img.classList.add('is-on');
        img.src = src;
    }

    async function load() {
        try {
            title = (await gqlFetch(TITLE_QUERY, {titleId: TITLE_ID})).title;
        } catch (e) {
            console.error(e);
            $('info').replaceChildren(el('p', {class: 'sx-by'}, 'This game could not be loaded. Reload the page to try again.'));
            return;
        }
        if (!title) return renderMissing();

        document.title = `${SHOP_NAME} | ${cleanName(title.name)}`;
        setLayer($('backdrop'), (title.banner || {}).url);
        setLayer(document.querySelector('.sx-ambient img'), (title.bannerThumb || {}).url);
        renderInfo();
        renderMedia();
    }

    document.addEventListener('click', event => {
        const step = event.target.closest('[data-step]');
        if (step) showShot(shot + Number(step.dataset.step));
        const close = event.target.closest('[data-close]');
        if (close) close.closest('dialog').close();
        // A click on the dimmed area outside a dialog closes it.
        if (event.target instanceof HTMLDialogElement) event.target.close();
    });

    document.addEventListener('keydown', event => {
        if (!title || event.target.closest('input, textarea, select')) return;
        const otherDialog = document.querySelector('dialog[open]:not(#shotDialog)');
        if (otherDialog) return;
        if (event.key === 'ArrowRight') showShot(shot + 1);
        if (event.key === 'ArrowLeft') showShot(shot - 1);
    });

    window.addEventListener('resize', fitDescription);
    load();
</script>
{% endblock %}
