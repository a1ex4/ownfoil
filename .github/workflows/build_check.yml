name: Validate Python package build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: uv build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build
